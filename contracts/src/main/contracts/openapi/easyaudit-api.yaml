components:
  schemas:
    PingResponse:
      type: object
      required: [status, balance, owner]
      properties:
        status:
          type: string
        balance:
          $ref: "../schemas/common.yaml#/components/schemas/Money"
        owner:
          $ref: "../schemas/common.yaml#/components/schemas/Cnpj"
        page:
          $ref: "../schemas/common.yaml#/components/schemas/PageMeta"
    CreateTenantRequest:
      type: object
      required: [name, slug, cnpjs]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 2
          maxLength: 60
        cnpjs:
          type: array
          minItems: 1
          items:
            $ref: "../schemas/common.yaml#/components/schemas/CnpjInput"
    TenantResponse:
      type: object
      required: [id, name, slug, cnpjs, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        cnpjs:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    AddTenantCnpjRequest:
      type: object
      required: [cnpj]
      properties:
        cnpj:
          $ref: "../schemas/common.yaml#/components/schemas/CnpjInput"
    TenantCnpjResponse:
      type: object
      required: [cnpj, kind]
      properties:
        cnpj:
          type: string
          description: CNPJ completo (14) ou raiz (8), normalizado, sem máscara.
        kind:
          type: string
          enum: [FULL, ROOT]
    CreateIntegrationCredentialRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
    CredentialStatus:
      type: string
      enum: [ACTIVE, REVOKED]
    IntegrationCredentialResponse:
      type: object
      required: [keyId, description, createdAt, status]
      properties:
        keyId:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CredentialStatus"
    CreatedIntegrationCredentialResponse:
      type: object
      required: [keyId, secret, description, createdAt, status]
      properties:
        keyId:
          type: string
        secret:
          type: string
          description: Exibido somente nesta resposta; nunca mais retornado.
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CredentialStatus"
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Credencial ausente ou inválida
      content:
        application/problem+json:
          schema:
            $ref: "../schemas/common.yaml#/components/schemas/Problem"
    PayloadTooLarge:
      description: Corpo acima do limite
      content:
        application/problem+json:
          schema:
            $ref: "../schemas/common.yaml#/components/schemas/Problem"
    Forbidden:
      description: Sem permissão
      content:
        application/problem+json:
          schema:
            $ref: "../schemas/common.yaml#/components/schemas/Problem"
    NotFound:
      description: Recurso inexistente (ou de outro tenant)
      content:
        application/problem+json:
          schema:
            $ref: "../schemas/common.yaml#/components/schemas/Problem"
    Conflict:
      description: Conflito com o estado atual
      content:
        application/problem+json:
          schema:
            $ref: "../schemas/common.yaml#/components/schemas/Problem"
    BadRequest:
      description: Parâmetro inválido
      content:
        application/problem+json:
          schema:
            $ref: "../schemas/common.yaml#/components/schemas/Problem"
    ValidationError:
      description: Erro de validação
      content:
        application/problem+json:
          schema:
            $ref: "../schemas/common.yaml#/components/schemas/Problem"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token OIDC; o tenant vem da claim `tenant_id`.
    hmacKeyId:
      type: apiKey
      in: header
      name: X-EasyAudit-Key-Id
      description: Identificador público da credencial de integração (webhooks).
    hmacTimestamp:
      type: apiKey
      in: header
      name: X-EasyAudit-Timestamp
      description: Epoch em segundos; janela de 5 minutos (webhooks).
    hmacSignature:
      type: apiKey
      in: header
      name: X-EasyAudit-Signature
