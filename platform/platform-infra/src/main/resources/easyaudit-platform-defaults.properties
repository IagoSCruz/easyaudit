# Padrões da plataforma (precedência baixa: application.yaml e variáveis de ambiente sobrescrevem).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.modulith.events.jdbc.schema=messaging
spring.modulith.events.republish-outstanding-events-on-restart=true
# O schema e a tabela do registro de eventos vêm das migrações do Flyway, não do inicializador do Modulith.
spring.modulith.events.jdbc.schema-initialization.enabled=false
# Respostas JSON sem campos nulos (contrato OpenAPI: campos opcionais ausentes, nunca null).
spring.jackson.default-property-inclusion=non_null

# Observabilidade: traces via OTLP só se habilitado; os logs JSON (ecs) são ligados no application.yaml do app.
management.tracing.sampling.probability=0.1
management.tracing.export.otlp.enabled=false
management.logging.export.otlp.enabled=false
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# Upload multipart: o limite de cada XML (1 MB) é aplicado pela aplicação, por item; o container aceita ZIPs de até 20 MB.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
